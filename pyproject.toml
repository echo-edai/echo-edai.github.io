[project]
name = "echo-lab-portal"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["ruff==0.17.3"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["projects", "ref", "work"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
